version: '3.8'

services:
  front:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: thai_please_front
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - back

  back:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thai_please_back
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.phbpjhwogesiwndahjac:thai1234-please@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres.phbpjhwogesiwndahjac:thai1234-please@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - JWT_EXPIRES_IN=1d
      - AI_PROVIDER=gemini
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: thai_please_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thai_please_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: thai_please_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: adminer:latest
    container_name: thai_please_phpmyadmin
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
