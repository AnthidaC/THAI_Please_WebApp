<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="badge-title badge-desc">
  <title id="badge-title">Silver badge</title>
  <desc id="badge-desc">A silver medal with a layered diamond emblem.</desc>
  <defs>
    <linearGradient id="ribbon-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8E0E8" />
      <stop offset="55%" stop-color="#8C98A5" />
      <stop offset="100%" stop-color="#55616D" />
    </linearGradient>
    <linearGradient id="rim-metal" x1="0%" y1="0%" x2="100%" y2="100%">
